<!doctype html>
<html><head><meta charset="utf-8"><title>Reef Screensaver POC v2</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
#hud{position:fixed;left:10px;top:10px;color:#cfe;font:12px/1.4 monospace;background:rgba(0,0,0,.55);padding:6px 8px;border-radius:4px;display:none;white-space:pre;z-index:2}
#err{position:fixed;left:0;right:0;bottom:0;color:#f88;background:#200;font:13px monospace;white-space:pre-wrap;z-index:3}
</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="hud"></div><div id="err"></div>
<script src="assets/fish/fish.js"></script>
<script src="assets/coral/coral.js"></script>
<script src="assets/fx/fx.js"></script>
<script src="assets/front/front.js"></script>
<script src="assets/tex/tex.js"></script>
<script>
window.onerror=(m,s,l,c)=>{document.getElementById('err').textContent+=`ERROR: ${m} @${l}:${c}\n`;};
'use strict';
// ============================================================ setup
const W=1920,H=1080,PAN=1500,TAU=Math.PI*2,HPI=Math.PI/2;
const qs=new URLSearchParams(location.search);
let SEED=qs.has('seed')?+qs.get('seed'):Math.floor(Math.random()*1e9);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rng=mulberry32(SEED);
const rr=(a,b)=>a+(b-a)*rng(), ri=(a,b)=>Math.floor(rr(a,b+1)), pick=a=>a[Math.floor(rng()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function wpick(o){let s=0;for(const k in o)s+=o[k];let r=rng()*s;for(const k in o){r-=o[k];if(r<=0)return k;}return Object.keys(o)[0];}
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px';}
addEventListener('resize',fit);fit();
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}

// ============================================================ color utils
function hex2rgb(h){h=h.replace('#','');if(h.length==3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255];}
function rgbHex(r,g,b){return'#'+[r,g,b].map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('');}
function shade(h,a){const[r,g,b]=hex2rgb(h);const t=a<0?0:255,p=Math.abs(a);return rgbHex(r+(t-r)*p,g+(t-g)*p,b+(t-b)*p);}
function rgba(h,a){const[r,g,b]=hex2rgb(h);return`rgba(${r},${g},${b},${a})`;}
function mixc(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return rgbHex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t);}
function waterGrad(c){const g=c.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#3aaad6');g.addColorStop(.16,'#1b8cc2');g.addColorStop(.45,'#0e679a');g.addColorStop(.75,'#08436c');g.addColorStop(1,'#042a44');return g;}

// ============================================================ caustic texture (tileable worley F2-F1)
function makeCaustic(sz,n){const c=mk(sz,sz),x=c.getContext('2d'),img=x.createImageData(sz,sz),d=img.data;
  const pts=[...Array(n)].map(()=>[rng()*sz,rng()*sz]),w1=makeNoise(sz,sz/4),w2=makeNoise(sz,sz/4),w3=makeNoise(sz,sz/8);
  for(let y=0;y<sz;y++)for(let X=0;X<sz;X++){
    const qx=X+(w1(X,y)-.5)*sz*.12+(w3(X,y)-.5)*sz*.03,qy=y+(w2(X,y)-.5)*sz*.12+(w3(y,X)-.5)*sz*.03;let f1=1e9,f2=1e9;
    for(const p of pts){let dx=Math.abs(qx-p[0])%sz;dx=Math.min(dx,sz-dx);let dy=Math.abs(qy-p[1])%sz;dy=Math.min(dy,sz-dy);const q=dx*dx+dy*dy;
      if(q<f1){f2=f1;f1=q;}else if(q<f2)f2=q;}
    const v=Math.sqrt(f2)-Math.sqrt(f1);const b=Math.pow(clamp(1-v/(sz*.028),0,1),2.6)*(.65+.35*w3(X*2,y*2));
    const i=(y*sz+X)*4;d[i]=225;d[i+1]=250;d[i+2]=255;d[i+3]=b*255;}
  x.putImageData(img,0,0);const o=mk(sz,sz),ox=o.getContext('2d');ox.filter='blur(1.2px)';ox.drawImage(c,0,0);ox.filter='none';ox.drawImage(c,0,0);return o;}

// ============================================================ procedural textures (tileable value-noise fbm, lit)
function makeNoise(sz,cell,seedOff){const n=Math.ceil(sz/cell),g=new Float32Array(n*n);for(let i=0;i<g.length;i++)g[i]=rng();
  return(x,y)=>{const fx=x/cell,fy=y/cell,x0=Math.floor(fx),y0=Math.floor(fy),tx=fx-x0,ty=fy-y0,sx=tx*tx*(3-2*tx),sy=ty*ty*(3-2*ty);
    const a=g[((y0%n+n)%n)*n+((x0%n+n)%n)],b=g[((y0%n+n)%n)*n+(((x0+1)%n+n)%n)],c=g[(((y0+1)%n+n)%n)*n+((x0%n+n)%n)],d=g[(((y0+1)%n+n)%n)*n+(((x0+1)%n+n)%n)];
    return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy;};}
function makeRockTex(sz,base,tint){const oct=[makeNoise(sz,64),makeNoise(sz,32),makeNoise(sz,16),makeNoise(sz,8),makeNoise(sz,4)],alg=makeNoise(sz,48),alg2=makeNoise(sz,12);
  const hgt=new Float32Array(sz*sz);for(let y=0;y<sz;y++)for(let x=0;x<sz;x++){let h=0,a=1,t=0;for(const o of oct){h+=o(x,y)*a;t+=a;a*=.55;}hgt[y*sz+x]=h/t;}
  const c=mk(sz,sz),cx=c.getContext('2d'),img=cx.createImageData(sz,sz),d=img.data,B=hex2rgb(base),Tn=hex2rgb(tint);
  for(let y=0;y<sz;y++)for(let x=0;x<sz;x++){const i=y*sz+x,h=hgt[i],hx=hgt[y*sz+(x+1)%sz]-hgt[y*sz+(x-1+sz)%sz],hy=hgt[((y+1)%sz)*sz+x]-hgt[((y-1+sz)%sz)*sz+x];
    let nx=-hx*9,ny=-hy*9,nz=1;const nl=Math.hypot(nx,ny,nz);nx/=nl;ny/=nl;nz/=nl;
    const lit=Math.max(0,nx*-.35+ny*-.7+nz*.62)*1.25,ao=.55+.6*h;
    const k=clamp(alg(x,y)*1.3-.6+alg2(x,y)*.3,0,1);const al=k>.5?(k-.5)*2:0;
    let r=B[0]*(1-al)+Tn[0]*al,g=B[1]*(1-al)+Tn[1]*al,b=B[2]*(1-al)+Tn[2]*al;const sp=.85+.3*oct[4](x*3,y*3);
    const o=i*4;d[o]=clamp(r*lit*ao*sp,0,255);d[o+1]=clamp(g*lit*ao*sp,0,255);d[o+2]=clamp(b*lit*ao*sp,0,255);d[o+3]=255;}
  cx.putImageData(img,0,0);return c;}
function makeSandTex(sz){const n1=makeNoise(sz,32),n2=makeNoise(sz,6),n3=makeNoise(sz,2),c=mk(sz,sz),cx=c.getContext('2d'),img=cx.createImageData(sz,sz),d=img.data;
  for(let y=0;y<sz;y++)for(let x=0;x<sz;x++){const rip=.5+.5*Math.sin((x*.07+n1(x,y)*6)+y*.02),v=.78+.12*rip+.1*n2(x,y)+.12*(n3(x,y)-.5);const o=(y*sz+x)*4;
    d[o]=222*v;d[o+1]=206*v;d[o+2]=170*v;d[o+3]=255;}cx.putImageData(img,0,0);return c;}
let ROCK_TEX=null,SAND_TEX=null;const TEXI={};
// photo textures (ambientCG, CC0, pre-lit from their normal/AO maps), tinted for a reef: coralline-algae pinks, turf greens
function photoTex(key,size,tints,blotch){const im=TEXI[key];if(!im)return null;const c=mk(size,size),x=c.getContext('2d');x.drawImage(im,0,0,size,size);
  for(const[op,col,a]of tints){x.globalCompositeOperation=op;x.globalAlpha=a;x.fillStyle=col;x.fillRect(0,0,size,size);}
  x.globalAlpha=1;x.globalCompositeOperation='source-over';
  // colour variation (coralline pink / turf green patches) built in a separate generated canvas and blended over:
  // never read back pixels of the loaded photo (file:// pages taint the canvas and getImageData throws)
  if(blotch){const n=makeNoise(size,size/4),n2=makeNoise(size,size/10),q=Math.ceil(size/4),bc=mk(q,q),bx=bc.getContext('2d'),id=bx.createImageData(q,q),d=id.data;
    for(let y=0;y<q;y++)for(let X=0;X<q;X++){const v=n(X*4,y*4)*.7+n2(X*4,y*4)*.3,i=(y*q+X)*4;
      if(v>.58){d[i]=230;d[i+1]=120;d[i+2]=170;d[i+3]=Math.min(1,(v-.58)*4)*120;}else if(v<.3){d[i]=110;d[i+1]=150;d[i+2]=70;d[i+3]=Math.min(1,(.3-v)*4)*90;}}
    bx.putImageData(id,0,0);x.globalCompositeOperation='soft-light';x.imageSmoothingQuality='high';x.drawImage(bc,0,0,size,size);x.globalCompositeOperation='source-over';}
  return c;}
// ============================================================ BANDS (parallax depth layers)
const BANDS=[
  {name:'far', par:.32,scale:.42,fog:.62,blur:2.6,dblur:1.4,reefTop:.60,rock:'#5a5f78'},
  {name:'mid', par:.62,scale:.68,fog:.3,blur:1.1,reefTop:.68,rock:'#6a5a6e'},
  {name:'near',par:1.0,scale:1.0,fog:.05,reefTop:.76,rock:'#75605e'},
];
const CORAL_COLS=['#9b55b8','#e86a9a','#f08a5d','#e8c547','#5fb37a','#c9a27a','#3fb0b0','#d94f4f','#b9a6e0','#ff9fb8','#7fd0a0','#e05a8a'];

// ---------- coral painters (static)
function staghorn(c,x,y,s,col){const segs=[];
  (function br(x,y,a,len,w,d){const x2=x+Math.cos(a)*len,y2=y+Math.sin(a)*len;segs.push([x,y,x2,y2,w,d]);
    if(d<=0)return;const n=rng()<.35?3:2;for(let i=0;i<n;i++)br(x2,y2,a+rr(-.7,.7)*(i?1:.5),len*rr(.62,.85),w*.78,d-1);
  })(x,y,-HPI+rr(-.35,.35),rr(22,40)*s,rr(6,10)*s,ri(3,4));
  const dk=shade(col,-.45),lt=shade(col,.35),tip=shade(col,.6);c.lineCap='round';
  for(const g of segs){c.strokeStyle=dk;c.lineWidth=g[4]+2.5*s;c.beginPath();c.moveTo(g[0],g[1]);c.lineTo(g[2],g[3]);c.stroke();}
  for(const g of segs){c.strokeStyle=col;c.lineWidth=g[4];c.beginPath();c.moveTo(g[0],g[1]);c.lineTo(g[2],g[3]);c.stroke();}
  for(const g of segs){c.strokeStyle=lt;c.lineWidth=g[4]*.35;c.beginPath();c.moveTo(g[0]-g[4]*.2,g[1]);c.lineTo(g[2]-g[4]*.2,g[3]);c.stroke();}
  c.fillStyle=tip;for(const g of segs)if(g[5]==0){c.beginPath();c.arc(g[2],g[3],g[4]*.55,0,TAU);c.fill();}}
function brain(c,x,y,r,col){c.save();c.beginPath();c.ellipse(x,y,r,r*.78,0,Math.PI,TAU);c.closePath();
  const g=c.createRadialGradient(x-r*.3,y-r*.6,r*.1,x,y-r*.2,r*1.1);g.addColorStop(0,shade(col,.35));g.addColorStop(.6,col);g.addColorStop(1,shade(col,-.5));
  c.fillStyle=g;c.fill();c.clip();c.strokeStyle=rgba(shade(col,-.55),.55);c.lineWidth=Math.max(1,r*.045);c.lineCap='round';
  for(let i=0;i<r*.5;i++){let px=x+rr(-r,r),py=y-rr(0,r*.8),a=rr(0,TAU);c.beginPath();c.moveTo(px,py);
    for(let k=0;k<10;k++){a+=rr(-.9,.9);px+=Math.cos(a)*r*.08;py+=Math.sin(a)*r*.08;c.lineTo(px,py);}c.stroke();}
  c.restore();}
function table(c,x,y,s,col){const rx=rr(45,85)*s,ry=rx*.2,h=rr(25,45)*s;
  c.fillStyle=shade(col,-.4);c.fillRect(x-5*s,y-h,10*s,h);
  c.fillStyle=shade(col,-.35);c.beginPath();c.ellipse(x,y-h+ry*.4,rx,ry,0,0,TAU);c.fill();
  const g=c.createLinearGradient(0,y-h-ry,0,y-h+ry);g.addColorStop(0,shade(col,.4));g.addColorStop(1,col);
  c.fillStyle=g;c.beginPath();c.ellipse(x,y-h,rx,ry,0,0,TAU);c.fill();
  c.fillStyle=rgba(shade(col,.6),.7);for(let i=0;i<22;i++){const a=rr(0,TAU);c.beginPath();c.arc(x+Math.cos(a)*rx*.95,y-h+Math.sin(a)*ry*.95,1.6*s,0,TAU);c.fill();}}
function tubes(c,x,y,s,col){const n=ri(3,6);for(let i=0;i<n;i++){const tw=rr(9,17)*s,th=rr(30,85)*s,a=rr(-.3,.3),ox=(i-n/2)*tw*.8;
  c.save();c.translate(x+ox,y);c.rotate(a);const g=c.createLinearGradient(-tw/2,0,tw/2,0);
  g.addColorStop(0,shade(col,-.5));g.addColorStop(.35,shade(col,.2));g.addColorStop(.6,col);g.addColorStop(1,shade(col,-.55));
  c.fillStyle=g;c.beginPath();c.roundRect(-tw/2,-th,tw,th,tw*.3);c.fill();
  c.fillStyle=shade(col,.35);c.beginPath();c.ellipse(0,-th,tw/2,tw*.22,0,0,TAU);c.fill();
  c.fillStyle='#1a0c18';c.beginPath();c.ellipse(0,-th,tw*.36,tw*.14,0,0,TAU);c.fill();c.restore();}}
function fan(c,x,y,s,col){c.lineCap='round';const dk=shade(col,-.3);
  (function br(x,y,a,len,w,d){const x2=x+Math.cos(a)*len,y2=y+Math.sin(a)*len;c.strokeStyle=d>3?dk:col;c.lineWidth=w;c.beginPath();c.moveTo(x,y);c.lineTo(x2,y2);c.stroke();
    if(d<=0)return;br(x2,y2,a-rr(.15,.5),len*rr(.75,.9),Math.max(.8*s,w*.75),d-1);br(x2,y2,a+rr(.15,.5),len*rr(.75,.9),Math.max(.8*s,w*.75),d-1);
  })(x,y,-HPI+rr(-.2,.2),rr(22,34)*s,4*s,6);
}
function bush(c,x,y,s,col){const n=ri(7,14);for(let i=0;i<n;i++){const r=rr(9,17)*s,px=x+rr(-28,28)*s,py=y-rr(5,45)*s*(1-Math.abs(px-x)/(40*s));
  const g=c.createRadialGradient(px-r*.3,py-r*.4,1,px,py,r);g.addColorStop(0,shade(col,.45));g.addColorStop(.7,col);g.addColorStop(1,shade(col,-.4));
  c.fillStyle=g;c.beginPath();c.arc(px,py,r,0,TAU);c.fill();
  c.fillStyle=rgba(shade(col,.7),.6);for(let k=0;k<5;k++){c.beginPath();c.arc(px+rr(-r,r)*.6,py+rr(-r,r)*.6,1.3*s,0,TAU);c.fill();}}}
function boulder(c,x,y,r,col){c.beginPath();c.ellipse(x,y,r*1.2,r*.8,0,Math.PI,TAU);c.closePath();
  const g=c.createRadialGradient(x-r*.4,y-r*.6,1,x,y-r*.3,r*1.3);g.addColorStop(0,shade(col,.3));g.addColorStop(1,shade(col,-.45));c.fillStyle=g;c.fill();
  c.fillStyle=rgba(shade(col,.55),.7);for(let i=0;i<r*1.5;i++){const a=rr(Math.PI,TAU),d=Math.sqrt(rng());c.beginPath();c.arc(x+Math.cos(a)*r*1.1*d,y+Math.sin(a)*r*.75*d,Math.max(1,r*.05),0,TAU);c.fill();}}
function barrel(c,x,y,s,col){const h=rr(45,90)*s,w0=rr(18,26)*s,w1=w0*rr(1.3,1.7);
  const g=c.createLinearGradient(x-w1,0,x+w1,0);g.addColorStop(0,shade(col,-.55));g.addColorStop(.4,shade(col,.15));g.addColorStop(1,shade(col,-.6));
  c.fillStyle=g;c.beginPath();c.moveTo(x-w0,y);c.quadraticCurveTo(x-w1*1.1,y-h*.6,x-w1,y-h);c.lineTo(x+w1,y-h);c.quadraticCurveTo(x+w1*1.1,y-h*.6,x+w0,y);c.closePath();c.fill();
  c.strokeStyle=rgba(shade(col,-.6),.5);c.lineWidth=1.5*s;for(let i=1;i<6;i++){const yy=y-h*i/6;c.beginPath();c.moveTo(x-w0-(w1-w0)*i/6,yy);c.lineTo(x+w0+(w1-w0)*i/6,yy);c.stroke();}
  c.fillStyle='#200c14';c.beginPath();c.ellipse(x,y-h,w1*.85,w1*.22,0,0,TAU);c.fill();}
function urchin(c,x,y,s){c.strokeStyle='#1a0f22';c.lineWidth=1.3*s;for(let i=0;i<36;i++){const a=rr(Math.PI*.9,TAU+.2),l=rr(12,24)*s;c.beginPath();c.moveTo(x,y-6*s);c.lineTo(x+Math.cos(a)*l,y-6*s+Math.sin(a)*l);c.stroke();}
  c.fillStyle='#2a1838';c.beginPath();c.arc(x,y-6*s,8*s,0,TAU);c.fill();}
function starfish(c,x,y,s,col){c.save();c.translate(x,y);c.scale(1,.45);c.rotate(rr(0,TAU));c.fillStyle=col;c.beginPath();
  for(let i=0;i<10;i++){const r=(i%2?6:18)*s,a=i/10*TAU;c.lineTo(Math.cos(a)*r,Math.sin(a)*r);}c.closePath();c.fill();c.restore();}

// ---------- photo coral
const CIMG={};
function coralGroups(){const g={};for(const k in (window.CORAL_ASSETS||{}))if(CIMG[k])(g[CORAL_ASSETS[k].kind]=g[CORAL_ASSETS[k].kind]||[]).push(k);return g;}
function bakeCoral(key,wid,hgt,flip,hue,vivid){const c=mk(Math.ceil(wid),Math.ceil(hgt)),x=c.getContext('2d');x.filter=vivid?'saturate(1.05) brightness(1.12)':`hue-rotate(${hue||0}deg) saturate(${rr(.72,.88)})`;
  if(flip){x.translate(wid,0);x.scale(-1,1);}x.drawImage(CIMG[key],0,0,wid,hgt);x.setTransform(1,0,0,1,0,0);x.filter='none';
  x.globalCompositeOperation='source-atop';const g=x.createLinearGradient(0,0,0,hgt);g.addColorStop(0,'rgba(120,200,230,.10)');g.addColorStop(.6,'rgba(20,90,130,.10)');g.addColorStop(1,'rgba(5,25,40,.45)');
  x.fillStyle=g;x.fillRect(0,0,wid,hgt);
  {const M=mk(c.width,c.height),mx=M.getContext('2d');mx.drawImage(c,0,0);mx.globalCompositeOperation='multiply';mx.fillStyle='#c4e2e6';mx.fillRect(0,0,M.width,M.height);mx.globalCompositeOperation='destination-in';mx.drawImage(c,0,0);
   x.globalCompositeOperation='copy';x.drawImage(M,0,0);x.globalCompositeOperation='source-over';}
  x.globalCompositeOperation='source-atop';x.globalAlpha=.07;x.fillStyle='#1b6f95';x.fillRect(0,0,wid,hgt);x.globalAlpha=1;
  {const r=Math.max(2,Math.min(wid,hgt)*.035),E=mk(c.width,c.height),ex=E.getContext('2d');ex.fillStyle='#2c86ad';ex.fillRect(0,0,E.width,E.height);
   ex.globalCompositeOperation='destination-out';ex.filter=`blur(${r}px)`;ex.drawImage(c,0,0);ex.filter='none';
   x.globalCompositeOperation='source-atop';x.globalAlpha=.55;x.drawImage(E,0,0);x.globalAlpha=1;}
  // feather the base so it settles into the rock instead of ending in a cut line
  x.globalCompositeOperation='destination-out';const f=x.createLinearGradient(0,hgt*.82,0,hgt);f.addColorStop(0,'rgba(0,0,0,0)');f.addColorStop(1,'rgba(0,0,0,.95)');x.fillStyle=f;x.fillRect(0,hgt*.8,wid,hgt*.2);return c;}
function placePhotoCorals(b,c,sandLine){const G=coralGroups(),s=b.scale,n=b.width;if(!Object.keys(G).length)return false;
  const W8={sponge:2,fan:b.name=='far'?2:1.2,soft:1.5,hard:6};for(const k in W8)if(!G[k])delete W8[k];
  const stat=[];b.sway=[];
  const clear=it=>!(b.voids||[]).some(([l,t,r,bt])=>{const cx=(l+r)/2,cy=(t+bt)/2,rx=(r-l)/2+it.wid*.3,ry=(bt-t)/2+it.hgt*.25,py=it.y-it.hgt*.35;return ((it.x-cx)/rx)**2+((py-cy)/ry)**2<1.15;})&&!(b.holes||[]).some(([hx,hy])=>Math.abs(it.x-hx)<it.wid*.5+120*s&&hy>it.y-it.hgt-60*s&&hy<it.y+60*s);
  const mkItem=(kind,x,y,sc)=>{const key=pick(G[kind]),A=CORAL_ASSETS[key],hgt=A.h*s*sc,wid=hgt*A.w/A.hp;return{kind,key,x,y,hgt,wid,flip:rng()<.5,hue:rng()<.6?rr(-25,25):0,ph:rr(0,TAU)};};

  }

  tctx.globalCompositeOperation='source-over';tctx.clearRect(0,0,W,H);let any=false;const maxH=460*b.scale;
  const cast=(x,y,L,a)=>{const sx=x+(y<0?0:0),gy=b.top(x+40*b.scale),h=gy-y;if(h<0||h>maxH)return;const t=h/maxH,w=L*(.85+t*.9),al=a*(1-t)*(1-t)*clamp((SUN-.45)/.55,0,1)*(.6+.4*DAY);if(al<.02)return;
    const px=x+ox+h*.18;if(px<-w||px>W+w)return;tctx.globalAlpha=al;tctx.drawImage(SHADOW,px-w/2,gy+oy-w*.12+6*b.scale,w,w*.26);any=true;};

    c.fillStyle='rgba(200,240,255,.12)';c.strokeStyle='rgba(230,250,255,.6)';c.lineWidth=Math.max(.7,r*.18);c.beginPath();c.arc(x,y,r,0,TAU);c.fill();c.stroke();

function render(){

  for(const[kx,ky,vx,vy,al]of[[1.1,.3,22,7,.8],[.7,.22,-15,5,.6]]){tctx.save();tctx.globalAlpha=al;tctx.translate(-(((camx*.15+T*vx)%(512*kx))+512*kx),-(((T*vy)%(512*ky))+512*ky));tctx.scale(kx,ky);tctx.fillStyle=pat;tctx.fillRect(0,0,W/kx+2048,2048);tctx.restore();}tctx.filter='none';tctx.globalAlpha=1;
  tctx.globalCompositeOperation='destination-in';const sgr=tctx.createLinearGradient(0,0,0,140);/*surface*/sgr.addColorStop(0,'rgba(0,0,0,.9)');sgr.addColorStop(.35,'rgba(0,0,0,.45)');sgr.addColorStop(1,'rgba(0,0,0,0)');tctx.fillStyle=sgr;tctx.fillRect(0,0,W,140);
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.24*(.5+.5*SUN)*(.7+.3*DAY);ctx.drawImage(tmp,0,0,W,140,0,0,W,140);ctx.restore();}

    if(p.z>1.3){const r=p.r*6,g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(220,245,255,${p.a*.14})`);g.addColorStop(1,'rgba(220,245,255,0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r);}
    else{ctx.fillStyle=`rgba(220,245,255,${p.a*p.z*.4})`;ctx.fillRect(x,y,p.r*p.z,p.r*p.z);}}
  ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H);

  {const dim=(1-SUN)*.22+(1-DAY)*.16;if(dim>.005){ctx.globalAlpha=dim;ctx.fillStyle='#03182a';ctx.fillRect(0,0,W,H);}
   if(DAY<.98&&!OFF.tint){ctx.globalAlpha=(1-DAY)*.07;ctx.fillStyle='#ffb070';ctx.fillRect(0,0,W,H);}ctx.globalAlpha=1;}
  if(REGEN.fade>0){ctx.globalAlpha=REGEN.fade;ctx.fillStyle='#062a44';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
}

  const tx=e.x-100-W/2;camx=clamp(tx/b.par,0,PAN);update(0);render();const sx=e.x-camLeft(b),sy=e.y+camy*b.par,z=500;const G=mk(W,H),g=G.getContext('2d');g.drawImage(cv,sx-z*.9,sy-z*.5,z*1.8,z,0,0,W,H);ctx.drawImage(G,0,0);if(qs.has('lipdbg')&&e.lip){ctx.fillStyle='#f0f';ctx.fillRect(0,0,e.lip.cv.width*3+20,e.lip.cv.height*3+20);ctx.drawImage(e.lip.cv,10,10,e.lip.cv.width*3,e.lip.cv.height*3);ctx.fillStyle='#fff';ctx.font='30px monospace';ctx.fillText(`lip ${e.lip.x|0},${e.lip.y|0} hole ${e.x|0},${e.y|0}`,20,e.lip.cv.height*3+60);}}
else if(qs.has('raytest')){ctx.fillStyle='#145a8a';ctx.fillRect(0,0,W,H);const ks=['manta_a','manta_b','ray_a','ray_b','ray_c'];
  ks.forEach((k,r)=>{for(let i=0;i<5;i++){const g=new Glider(BANDS[2],k,1,0);g.L=230;g.ph=i/5*TAU;g.vy=0;g.draw(ctx,190+i*380,110+r*210);}});}
else if(qs.has('crawltest')){ctx.fillStyle='#145a8a';ctx.fillRect(0,0,W,H);const ks=Object.keys(CRAWL);
  ks.forEach((k,r)=>{for(let i=0;i<5;i++){const cr=new Crawler(BANDS[2],k);cr.w=150;cr.speed=20;cr.tilt=0;cr.dir=1;cr.ph=i/5*TAU*.5;cr.draw(ctx,200+i*370,170+r*175);}});}
else if(qs.has('crawlzoom')){const b=BANDS[2];for(let i=0;i<200;i++)update(1/30);const cr=b.crawlers[0];camx=clamp((cr.x-100-W/2)/b.par,0,PAN);update(0);render();const sx=cr.x-camLeft(b),sy=cr.y+camy*b.par,z=420;const G=mk(W,H),g=G.getContext('2d');g.drawImage(cv,sx-z*.9,sy-z*.6,z*1.8,z,0,0,W,H);ctx.drawImage(G,0,0);}
else if(qs.has('octotest')){ctx.fillStyle='#145a8a';ctx.fillRect(0,0,W,H);OCTO.forEach((k,r)=>{for(let i=0;i<5;i++){const o=new Octopus(BANDS[2]);o.key=k;o.w=260;o.state=i==4?'jet':'crawl';o.t=0;o.dur=99;o.cyc=i/4*TAU;o.jetK=i==4?1:0;o.jy=0;o.camo=0;o.dir=1;o.tilt=0;o.ph=i/4*TAU*.5;o.ink=[];o.x=0;o.off=0;
    c2:{const b=o.b;o.b={top:()=>0};o.draw(ctx,200+i*370,330+r*330);o.b=b;}}});}
else if(qs.has('turntest')){ctx.fillStyle='#145a8a';ctx.fillRect(0,0,W,H);const tv=qs.get('turntest'),ks=(tv&&tv!='1'?tv:'bluetang,yellowtang,idol,clown').split(',');
  ks.forEach((kk,r)=>{const f=new Fish(BANDS[2],kk,{x:0,y:0,dir:1,sz:1});f.L=200;{const fk=Object.keys(FRONT_ASSETS).filter(k=>FRONT_ASSETS[k].side==f.asset.key);f.front=fk[0]||null;}f.ampS=.6;f.pitch=0;f.phase=1;for(let i=0;i<8;i++){f.turnT=.1+i/7*.6;f.dir=1;drawPhotoFish(ctx,f,140+i*235,140+r*270);}});}
else if(qs.has('emergetest')){const b=BANDS[2];for(let i=0;i<60;i++)update(1/30);const o=b.octos[0]||new Octopus(b);if(!b.octos.length)b.octos.push(o);o.x=camLeft(b)+W*.5;o.state='emerge';o.t=+(qs.get('et')||1);o.camo=0;render();
  const sx=o.x-camLeft(b),sy=o.y+camy*b.par,z=520;const G=mk(W,H),g=G.getContext('2d');g.drawImage(cv,sx-z*.9,sy-z*.75,z*1.8,z,0,0,W,H);ctx.drawImage(G,0,0);}
else if(qs.has('octoturn')){ctx.fillStyle='#145a8a';ctx.fillRect(0,0,W,H);OCTO.forEach((kk,r)=>{for(let i=0;i<7;i++){const o=new Octopus(BANDS[2]);o.key=kk;o.w=230;o.state='rest';o.t=0;o.camo=0;o.dir=-1;o.faceS=1-2*i/6;o.tilt=0;o.ink=[];o.jy=0;o.x=0;o.off=0;
    const b=o.b;o.b={top:()=>0};o.draw(ctx,150+i*270,320+r*330);o.b=b;}});}
else if(qs.has('sharkzoom')){ctx.fillStyle='#145a8a';ctx.fillRect(0,0,W,H);for(let i=0;i<3;i++){const f=new Fish(BANDS[2],'shark',{x:0,y:0,dir:1,sz:1});f.L=1100;f.ampS=1;f.pitch=0;f.face=1;f.bend=0;f.phase=1+i*1.4;drawPhotoFish(ctx,f,W/2,180+i*340);}}
else if(qs.has('lionturn')){ctx.fillStyle='#145a8a';ctx.fillRect(0,0,W,H);const f=new Fish(BANDS[2],qs.get('sp')||'lion',{x:0,y:0,dir:1,sz:1});f.L=260;f.ampS=.5;f.pitch=0;f.phase=1;{const fk=Object.keys(FRONT_ASSETS).filter(k=>FRONT_ASSETS[k].side==f.asset.key);f.front=fk[0]||null;}
  for(let i=0;i<16;i++){f.turnT=i/15;f.dir=1;drawPhotoFish(ctx,f,180+(i%4)*500,150+Math.floor(i/4)*270);ctx.fillStyle='#fff';ctx.font='20px monospace';ctx.fillText('t='+(i/15).toFixed(2),60+(i%4)*500,40+Math.floor(i/4)*270);}}
else if(qs.has('hermitturn')){ctx.fillStyle='#145a8a';ctx.fillRect(0,0,W,H);for(let i=0;i<7;i++){const cr=new Crawler(BANDS[2],'hermit_a');cr.w=200;cr.speed=0;cr.tilt=0;cr.faceS=1-2*i/6;cr.dir=-1;cr.draw(ctx,160+i*270,500);}}
else if(qs.has('rigtest')){ctx.fillStyle='#145a8a';ctx.fillRect(0,0,W,H);const ks=['turtle_a','turtle_b','turtle_c'];
  ks.forEach((k,r)=>{for(let i=0;i<6;i++){const g=new Glider(BANDS[2],k,1,0);g.L=280;g.ph=i/6*TAU;g.draw(ctx,170+i*315,180+r*340);}});}
else if(qs.has('film')){// filmstrip: follow one fish for n frames (debug tool)
  const n0=+qs.get('t')*30;for(let i=0;i<n0;i++)update(1/30);
  if(qs.get('film')=='shark'){events.shark=999;spawnShark();const sh=BANDS.flatMap(b=>b.predators)[0];BANDS[2].predators.includes(sh)||BANDS[1].predators.push;for(let i=0;i<150;i++)update(1/30);}
  const sh0=BANDS.flatMap(b=>b.predators)[0];const b=sh0&&qs.get('film')=='shark'?sh0.band:BANDS[2],sp=qs.get('film');const onS=f=>{const x=f.x-camLeft(b);return x>250&&x<W-250&&f.y>150&&f.y<H-150;};let f=b.fish.find(f=>f.asset&&f.key==sp&&!f.school&&onS(f))||b.fish.find(f=>f.asset&&!f.school&&!f.home&&onS(f))||b.fish.find(f=>f.asset);
  if(qs.has('peck')&&f){f.state='peck';f.timer=99;f.biteT=.2;f.y=b.top(f.x)-f.L*.3;f.life=999;}
  const N=+(qs.get('n')||16),st=+(qs.get('step')||.1),cols=4,cw=W/cols,ch=H/Math.ceil(N/cols),G=mk(W,H),g=G.getContext('2d');
  for(let i=0;i<N;i++){if(qs.has('turn')&&i==3){f.tx=f.x-f.dir*600;f.ty=f.y;f.turnCd=0;f.state='swim';f.timer=99;}
    for(let k=0;k<Math.round(st*30);k++)update(1/30);render();
    const sx=f.x-camLeft(b),sy=f.y+camy*b.par,zw=f.L*2.4,zh=zw*ch/cw;
    g.drawImage(cv,sx-zw/2,sy-zh/2,zw,zh,(i%cols)*cw,Math.floor(i/cols)*ch,cw,ch);
    g.fillStyle='#fff';g.font='20px monospace';g.fillText(`${f.key} t+${(i*st).toFixed(2)} face ${f.face.toFixed(2)} thr ${f.thrust.toFixed(2)}`,(i%cols)*cw+8,Math.floor(i/cols)*ch+24);}
  ctx.drawImage(G,0,0);}
else if(qs.has('t')){const n=+qs.get('t')*30;if(qs.has('shark'))events.shark=+qs.get('shark');for(let i=0;i<n;i++){if(qs.has('spawn')&&i==n-200){spawnTurtle();spawnManta();spawnJellies();{const b=BANDS[2];if(!b.octos.length)b.octos.push(new Octopus(b));const o=b.octos[0];o.x=camLeft(b)+W*.45;o.state='crawl';o.t=0;o.dur=99;}for(const j of BANDS.flatMap(b=>b.jellies))j.y=H*.6;}update(1/30);}render();}
else{for(let i=0;i<60;i++)update(1/30);requestAnimationFrame(frame);}});
</script></body></html>
